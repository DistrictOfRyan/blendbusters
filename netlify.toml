# Site config. NOTE: _redirects is auto-generated by normalize_urls.py, so
# hand-written rules belong here where they won't be overwritten.

# The repo root is the publish directory, so build/analysis scripts were being
# served publicly (blendbusters.com/ad_viability.py returned 200). They contain
# no credentials, but they do expose CPC, margin assumptions, profitability
# math and page-generation logic. Block them.
# The dataset (.csv/.json) is deliberately left public — it carries publisher/
# license metadata and is meant to be citable by AI search engines.
[[redirects]]
  from = "/*.py"
  to = "/404.html"
  status = 404
  force = true
